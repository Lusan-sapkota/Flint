services:
  flint:
    image: ghcr.io/lusan-sapkota/flint:latest
    # Host networking, so Flint reaches the system Ollama at localhost:11434,
    # where the GPU and the models already are, without Ollama having to
    # listen beyond localhost. Linux only.
    network_mode: host
    environment:
      HOST: 127.0.0.1
      # Not 8080: that's the port every dev server reaches for first.
      PORT: ${FLINT_PORT:-3141}
      OLLAMA_BASE_URL: http://localhost:11434
    volumes:
      # A plain folder next to this file, not a named volume: it survives
      # `docker compose down -v` and is deleted only by deleting the folder.
      # Create it before the first start (mkdir data) so it's owned by you,
      # not root.
      - ./data:/data
    restart: unless-stopped
