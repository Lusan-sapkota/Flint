services:
  flint:
    image: ghcr.io/lusan-sapkota/flint:latest
    # Reach the system Ollama on localhost without exposing it. Linux only.
    network_mode: host
    environment:
      HOST: 127.0.0.1
      # Not 8080, which every dev server grabs first.
      PORT: ${FLINT_PORT:-3141}
      OLLAMA_BASE_URL: http://localhost:11434
      # The folder browser starts here.
      HOME: ${FLINT_FOLDERS:-${HOME}}
    volumes:
      # Plain folder, survives `down -v`; mkdir data first so you own it.
      - ./data:/data
      # Your folders at their real path; set FLINT_FOLDERS to limit what Flint sees.
      - ${FLINT_FOLDERS:-${HOME}}:${FLINT_FOLDERS:-${HOME}}
    restart: unless-stopped
