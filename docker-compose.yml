services:
  flint:
    build: .
    ports:
      # Not 8080: that's the port every dev server reaches for first.
      - "127.0.0.1:${FLINT_PORT:-3141}:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - flint-data:/data
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

volumes:
  flint-data:
  ollama-models:
